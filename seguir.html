<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
        <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

    <title>Mensagem do Universo | AION</title>
</head>

<body class="pagina-seguir">

    <header class="cabecalho">

        <div class="logo-aion">
            <img src="assets/logo/logoAion.png" alt="AION">
            <span class="subtitulo-aion">
        YOGA · CONSCIÊNCIA · MOVIMENTO
    </span>
        </div>

    </header>

    <main>

        <section class="tela-seguir">

            <div class="card-mensagem">

                <img class="ilustracao-mensagem" src="assets/logo/ilustracaoMensagem.png" alt="">

                <h1>
                    Uma mensagem<br>
                    espera por você
                </h1>

                <div class="divisor">
                    <span class="linha linha-esquerda"></span>

                    <span class="lua-divisor">☾</span>

                    <span class="linha linha-direita"></span>
                </div>

                <p>
                    Antes de descobrir o que o universo
                    reservou para você, venha se conectar
                    com a Aion. Por lá, compartilhamos
                    conteúdos, práticas e inspirações
                    para o seu caminho.
                </p>

                <a class="botao-seguir" href="https://www.instagram.com/aionmove/" target="_blank"
                    rel="noopener noreferrer">
                    <i class="fa-brands fa-instagram"></i>

                    <span>SEGUIR @AIONMOVE</span>

                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>

                <button class="botao-revelar" id="btn-revelar">
                    <span>JÁ SEGUI, REVELAR MENSAGEM</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

            </div>

        </section>

    </main>

    <script src="seguir.js"></script>

</body>

</html>
