<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <title>Mensagem do Universo</title>
</head>

<body>

    <header class="cabecalho">

        <p class="subtitulo">Mensagem do universo</p>

        <h1>Qual é o seu signo?</h1>

        <p class="descricao">
            Descubra o que o universo<br> tem para revelar sobre você!
        </p>

    </header>


    <main>

        <section class="selecao-signos">

            <h2>Escolha seu signo:</h2>

            <ul class="lista-signos">

                <li>
                    <button class="signo signo-capricornio">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Capricórnio</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-aquario">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Aquário</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-peixes">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Peixes</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-aries">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Áries</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-touro">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Touro</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-gemeos">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Gêmeos</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-cancer">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Câncer</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-leao">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Leão</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-virgem">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Virgem</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-libra">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Libra</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-escorpiao">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Escorpião</span>
                    </button>
                </li>

                <li>
                    <button class="signo signo-sagitario">
                        <span class="icone-signo"></span>
                        <span class="nome-signo">Sagitário</span>
                    </button>
                </li>

            </ul>

        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
